# Serves the built React app and forwards /api calls to the services by their Compose names.
# The browser only talks to this container, so the services need no CORS setup.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Names are looked up per request (not only at startup),
    # so a restarted service with a new IP is still found.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $user_service      http://user-service:8081;
    set $product_service   http://product-service:8082;
    set $inventory_service http://inventory-service:8083;

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    location /api/users     { proxy_pass $user_service; }
    location /api/products  { proxy_pass $product_service; }
    location /api/inventory { proxy_pass $inventory_service; }

    # health of each service, shown in the status bar of the UI
    location = /status/user-service      { proxy_pass $user_service/actuator/health; }
    location = /status/product-service   { proxy_pass $product_service/health; }
    location = /status/inventory-service { proxy_pass $inventory_service/health; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
