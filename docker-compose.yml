name: marketplace

services:
  mysql:
    image: mysql:8.0
    container_name: marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: marketplace
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # host 3307 avoids clashing with a local MySQL; containers use mysql:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketplace-net

  product-service:
    build: ./product-service
    image: marketplace/product-service:1.0
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: 8082
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-marketplace}
      DB_USER: ${DB_USER:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD}
      INVENTORY_URL: http://inventory-service:8083   # service name, not localhost
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      # inventory-service (condition: service_healthy) is added when that service is merged
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - marketplace-net

  # user-service and inventory-service are added here
  # through their own pull requests (see docs/api-contract.md).

volumes:
  mysql-data:

networks:
  marketplace-net:
