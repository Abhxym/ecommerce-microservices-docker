name: marketplace

services:
  mysql:
    image: mysql:8.4
    container_name: marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: marketplace
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # host 3307 avoids clashing with a local MySQL; containers use mysql:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketplace-net

  product-service:
    build: ./product-service
    image: marketplace/product-service:1.0
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: 8082
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-marketplace}
      DB_USER: ${DB_USER:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD}
      INVENTORY_URL: http://inventory-service:8083   # service name, not localhost
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - marketplace-net

  user-service:
    build: ./user-service
    image: marketplace/user-service:1.0
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: 8081
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-marketplace}
      DB_USER: ${DB_USER:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s
    networks:
      - marketplace-net

  inventory-service:
    build: ./inventory-service
    image: marketplace/inventory-service:1.0
    container_name: inventory-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0        # listen on all interfaces so other containers can connect
      PORT: 8083
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-marketplace}
      DB_USER: ${DB_USER:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - marketplace-net

volumes:
  mysql-data:

networks:
  marketplace-net:
