name: marketplace

services:
  mysql:
    image: mysql:8.0
    container_name: marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: marketplace
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # host 3307 avoids clashing with a local MySQL; containers use mysql:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketplace-net

  # user-service, product-service and inventory-service are added here
  # through their own pull requests (see docs/api-contract.md).

volumes:
  mysql-data:

networks:
  marketplace-net:
