# CI for the marketplace.
# 1. Each service is tested on its own (fast feedback, runs in parallel).
# 2. Then the whole stack is built with Docker Compose and checked end to end.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  user-service:
    name: user-service (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -B test

  product-service:
    name: product-service (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: product-service/package-lock.json
      - run: npm ci
      - name: Run tests
        run: npm test

  order-service:
    name: order-service (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: order-service/package-lock.json
      - run: npm ci
      - name: Run tests
        run: npm test

  inventory-service:
    name: inventory-service (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: inventory-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  web-ui:
    name: web-ui (React build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    needs: [user-service, product-service, order-service, inventory-service, web-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Check the Compose file
        run: docker compose config --quiet

      - name: Build images and start the stack
        # --wait returns only when every container is healthy (or fails if one is not)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Show containers
        run: docker compose ps

      - name: Check every service
        run: |
          set -e
          check() {
            echo "== $1"
            body=$(curl -sf "$1")
            echo "$body"
            echo "$body" | grep -q "$2" || { echo "expected '$2' in the response"; exit 1; }
          }
          check http://localhost:8081/actuator/health '"status":"UP"'
          check http://localhost:8082/health '"status":"UP"'
          check http://localhost:8083/health '"status":"UP"'
          check http://localhost:8085/health '"status":"UP"'
          check http://localhost:8081/api/users 'priya.sharma@example.com'
          check http://localhost:8083/api/inventory/1 '"quantity":120'
          # product-service must get the stock from inventory-service (Q3)
          check http://localhost:8082/api/products/1 '"stock":{"quantity":120'
          # the same calls through the ShopEase nginx
          check http://localhost:8080/ '<div id="root">'
          check http://localhost:8080/api/products/3 '"inStock":false'

      - name: Place and cancel an order
        run: |
          set -e
          stock() { curl -sf localhost:8083/api/inventory/$1 | grep -o '"quantity":[0-9]*' | cut -d: -f2; }
          echo "== place an order: 2 x product 1, 1 x product 2"
          order=$(curl -sf -X POST localhost:8080/api/orders -H "Content-Type: application/json"             -d '{"userId":1,"items":[{"productId":1,"quantity":2},{"productId":2,"quantity":1}]}')
          echo "$order"
          echo "$order" | grep -q '"grandTotal":1352' || { echo "wrong total"; exit 1; }
          id=$(echo "$order" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          [ "$(stock 1)" = "118" ] && [ "$(stock 2)" = "59" ] || { echo "stock was not reserved"; exit 1; }

          echo "== an order that cannot be filled releases what it reserved (Saga)"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST localhost:8085/api/orders -H "Content-Type: application/json"             -d '{"userId":1,"items":[{"productId":2,"quantity":1},{"productId":3,"quantity":1}]}')
          [ "$code" = "409" ] || { echo "expected 409, got $code"; exit 1; }
          [ "$(stock 2)" = "59" ] || { echo "stock was not released"; exit 1; }

          echo "== cancel gives the stock back"
          curl -sf -X POST localhost:8085/api/orders/$id/cancel | grep -q '"status":"CANCELLED"'
          [ "$(stock 1)" = "120" ] && [ "$(stock 2)" = "60" ] || { echo "stock was not given back"; exit 1; }
          echo "order flow ok"

      - name: Check the database
        run: bash db/upgrade/counts.sh

      - name: Logs of all containers
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
