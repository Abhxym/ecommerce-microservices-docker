spring.application.name=auth-service
server.port=${PORT:8084}

# Optional local properties import (ignored by git, for local development)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marketplace}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
user-service.url=${USER_SERVICE_URL:http://user-service:8081}
jwt.secret=${JWT_SECRET}
jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:3600}
